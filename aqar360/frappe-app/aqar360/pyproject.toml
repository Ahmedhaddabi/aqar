[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqar360"
version = "0.0.1"
description = "Aqar 360 extensions for Frappe v16"
requires-python = ">=3.14,<3.15"
authors = [{name = "Aqar 360"}]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.js", "*.html", "translations/*.csv"]
