name: Web app checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aqar360/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aqar360/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Scan tracked source for credential material
        working-directory: .
        shell: bash
        run: |
          # Real keys never belong in the repo: they go in Admin → Integrations or Vercel environment variables.
          if git grep -nE '(sk-[A-Za-z0-9]{24,}|sk-ant-[A-Za-z0-9_-]{20,}|re_[A-Za-z0-9]{16,}|EAA[A-Za-z0-9]{30,}|postgres(ql)?://[^:@/ ]+:[^@/ ]+@|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY)' -- aqar360; then exit 1; fi
